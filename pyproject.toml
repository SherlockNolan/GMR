[project]
name = "general-motion-retargeting"
version = "0.2.0"
description = "GMR motion retargeting runtime"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mujoco>=3.2.3",
    "mink>=1.3.0,<2",
    "qpsolvers[daqp]>=4.3.1",
    "numpy>=1.26",
    "scipy>=1.14",
    "rich>=13",
    "tqdm>=4.66",
    "loop-rate-limiters>=1.1",
    "imageio[ffmpeg]>=2.34",
    "pillow>=10.2",
]

[project.optional-dependencies]
body-models = ["torch", "smplx"]

[tool.uv]
package = false
